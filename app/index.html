<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>POZZO</title>
    <style>
        /* modern css reset */
        html, body {
            background-color: #050300; /* deep vacuum tube void */
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }

        /* the physical monitor frame */
        #monitor {
            position: relative;
            width: 100%;
            height: 100%;
            background: #0d0902;
            overflow: hidden;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            padding: 40px; /* Forces text away from the "curved" glass borders */
        }

        /* --- GLASS OVERLAYS --- */

        /* curved glass tube vignette & inner bezel shadow */
        #monitor::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            /* heavy radial gradient creates the illusion of a bulging, curved monitor screen */
            background: radial-gradient(circle, rgba(0, 0, 0, 0) 70%, rgba(0, 0, 0, 0.75) 85%, rgba(0, 0, 0, 0.98) 100%);
            z-index: 20;
            pointer-events: none;
            box-shadow: inset 0px 0px 40px rgba(0, 0, 0, 1);
        }

        /* static scanlines */
        #monitor::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 11, 0, 0) 50%, rgba(0, 0, 0, 0.45) 50%);
            background-size: 100% 3px; /* Adjust thickness of horizontal scanlines here */
            z-index: 18;
            pointer-events: none;
        }

        /* rolling bar */
        .roll-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 100px;
            background: linear-gradient(to bottom, rgba(255, 176, 0, 0) 0%, rgba(255, 176, 0, 0.04) 10%, rgba(255, 176, 0, 0.0) 100%);
            z-index: 17;
            pointer-events: none;
            animation: roll 6s linear infinite;
        }

        @keyframes roll {
            0% { transform: translateY(-100px); }
            100% { transform: translateY(105vh); }
        }

        /* global screen flickering */
        .screen-flicker {
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: rgba(255, 176, 0, 0.003);
            z-index: 19;
            pointer-events: none;
            animation: crt-flicker 0.12s infinite;
        }

        @keyframes crt-flicker {
            0%   { opacity: 0.75; }
            25%  { opacity: 0.85; }
            50%  { opacity: 0.70; }
            75%  { opacity: 0.95; }
            100% { opacity: 0.80; }
        }

        /* --- TEXT --- */

        /* core terminal text */
        #output, #input-container {
            color: #ffb000;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.4;
            /* multi-layered text shadow creates glow */
            text-shadow: 0 0 2px rgba(255, 176, 0, 0.95),
                         0 0 8px rgba(255, 176, 0, 0.45),
                         0 0 16px rgba(255, 176, 0, 0.22);
            z-index: 5;
        }

        /* main output box */
        #output {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 15px;
            padding-right: 15px;
            /* soft blur layer over text */
            filter: blur(0.3px);
        }

        /* input interaction terminal line */
        #input-container {
            display: flex;
            align-items: center;
            border-top: 2px solid rgba(255, 176, 0, 0.15);
            padding-top: 15px;
            filter: blur(0.3px);
        }

        #prompt {
            margin-right: 12px;
            font-weight: 900;
        }

        #input-field {
            background: transparent;
            border: none;
            color: #ffb000;
            font-family: inherit;
            font-size: inherit;
            font-weight: inherit;
            flex-grow: 1;
            outline: none;
            text-shadow: inherit;
        }

        /* scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 176, 0, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 176, 0, 0.6); }
    </style>
</head>
<body>
    <div id="monitor">

        <div class="roll-bar"></div>
        <div class="screen-flicker"></div>

        <div id="output"></div>

        <div id="input-container" style="visibility: hidden;">
            <span id="prompt">></span>
            <input type="text" id="input-field" autocomplete="off" autofocus />
        </div>

    </div>

    <script>
        const outputDiv = document.getElementById('output');
        const inputContainer = document.getElementById('input-container');
        const inputField = document.getElementById('input-field');

        // Append incoming text from Python backend
        function addText(text) {
            outputDiv.innerText += text;
            outputDiv.scrollTop = outputDiv.scrollHeight; // Keep scrolling aligned to bottom
        }

        // Clear terminal screen
        function clearOutput() {
            outputDiv.innerText = '';
        }

        // Request user input focus
        function requestInput() {
            inputContainer.style.visibility = 'visible';
            inputField.value = '';
            inputField.focus();
        }

        // Form submit on hitting return key
        inputField.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                const value = inputField.value;
                inputContainer.style.visibility = 'hidden';
                addText(value + '\n');

                // Transmit inputs cleanly to the pywebview API hook
                pywebview.api.submit_input(value);
            }
        });

        // Ensure user focus lands back on input box when clicking anywhere on screen
        document.body.addEventListener('click', () => {
            if (inputContainer.style.visibility === 'visible') {
                inputField.focus();
            }
        });
    </script>
</body>
</html>
